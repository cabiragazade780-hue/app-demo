<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>3D Geyim Dizayn Konfiquratoru</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            width: 280px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ccc;
        }
        input, select, button {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
            outline: none;
        }
        button {
            background: #007bff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h3>Konfiqurator</h3>
        <div class="control-group">
            <label for="modelSelect">Geyim Modeli</label>
            <select id="modelSelect">
                <option value="tshirt">T-Shirt</option>
                <option value="hoodie">Hoodie</option>
            </select>
        </div>
        <div class="control-group">
            <label for="colorPicker">Parça Rəngi</label>
            <input type="color" id="colorPicker" value="#ffffff">
        </div>
        <div class="control-group">
            <label for="roughnessRange">Parıltı / Matlıq</label>
            <input type="range" id="roughnessRange" min="0" max="1" step="0.05" value="0.7">
        </div>
        <div class="control-group">
            <label for="textInput">Mətn Əlavə Et</label>
            <input type="text" id="textInput" placeholder="Mətn daxil edin...">
            <button id="addTextBtn">Mətni tətbiq et</button>
        </div>
    </div>

    <!-- Three.js və Fabric.js kitabxanaları -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/530/fabric.min.js"></script>

    <script>
        let scene, camera, renderer, currentMesh;
        
        // Fabric.js 2D Canvas (Tekstura üçün)
        const canvasElement = document.createElement('canvas');
        canvasElement.width = 1024;
        canvasElement.height = 1024;
        const fabricCanvas = new fabric.Canvas(canvasElement);
        
        const texture = new THREE.CanvasTexture(canvasElement);
        texture.anisotropy = 16;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            createModel('tshirt');
            setupEvents();
            animate();
        }

        function createModel(type) {
            if (currentMesh) {
                scene.remove(currentMesh);
                currentMesh.geometry.dispose();
                currentMesh.material.dispose();
            }

            let geometry;
            if (type === 'tshirt') {
                geometry = new THREE.CylinderGeometry(0.8, 0.7, 2, 32);
            } else {
                geometry = new THREE.BoxGeometry(1.2, 2, 0.8);
            }

            const material = new THREE.MeshStandardMaterial({
                color: document.getElementById('colorPicker').value,
                roughness: parseFloat(document.getElementById('roughnessRange').value),
                map: texture
            });

            currentMesh = new THREE.Mesh(geometry, material);
            scene.add(currentMesh);
        }

        function updateTexture() {
            fabricCanvas.renderAll();
            texture.needsUpdate = true;
        }

        function setupEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.getElementById('modelSelect').addEventListener('change', (e) => {
                createModel(e.target.value);
            });

            document.getElementById('colorPicker').addEventListener('input', (e) => {
                if (currentMesh) {
                    currentMesh.material.color.set(e.target.value);
                }
            });

            document.getElementById('roughnessRange').addEventListener('input', (e) => {
                if (currentMesh) {
                    currentMesh.material.roughness = parseFloat(e.target.value);
                }
            });

            document.getElementById('addTextBtn').addEventListener('click', () => {
                const textVal = document.getElementById('textInput').value;
                if (!textVal) return;

                const textObj = new fabric.Text(textVal, {
                    left: 512,
                    top: 512,
                    originX: 'center',
                    originY: 'center',
                    fontSize: 60,
                    fill: '#000000'
                });

                fabricCanvas.add(textObj);
                fabricCanvas.setActiveObject(textObj);
                updateTexture();
            });

            fabricCanvas.on('object:modified', updateTexture);
            fabricCanvas.on('object:scaling', updateTexture);
            fabricCanvas.on('object:rotating', updateTexture);
            fabricCanvas.on('object:translating', updateTexture);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (currentMesh) {
                currentMesh.rotation.y += 0.005;
            }
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
