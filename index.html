<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Apparel Design Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      margin: 0;
      padding: 20px;
    }
    h2 { text-align: center; color: #cba6f7; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #6c7086; margin-bottom: 24px; font-size: 14px; }
    .main-layout {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      max-width: 1200px;
      margin: 0 auto;
    }
    .panel {
      background: #313244;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .controls { width: 290px; display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    input, select, button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #45475a;
      background: #181825;
      color: #cdd6f4;
      font-family: inherit;
      transition: border-color .15s ease, background .15s ease;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #89b4fa;
    }
    button {
      background: #89b4fa;
      color: #11111b;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background .15s ease, transform .1s ease;
    }
    button:hover { background: #b4befe; }
    button:active { transform: scale(0.97); }
    .btn-toggle { background: #cba6f7 !important; }
    .btn-danger { background: #f38ba8; color: #11111b; }
    .btn-success { background: #a6e3a1; color: #11111b; }
    .btn-secondary { background: #45475a; color: #cdd6f4; }
    .btn-secondary.active { background: #f9e2af; color: #11111b; }

    .editor-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 460px;
      margin: 0 auto;
      background: #181825;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .apparel-svg {
      position: absolute;
      width: 340px;
      height: 440px;
      z-index: 1;
    }
    .canvas-wrapper {
      position: absolute !important;
      top: 40px;
      z-index: 2;
    }
    #three-view {
      width: 100%;
      max-width: 360px;
      height: 460px;
      margin: 0 auto;
      border-radius: 12px;
      background: #11111b;
      cursor: grab;
    }
    #three-view:active { cursor: grabbing; }
    .view-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .view-selector button { flex: 1; }
    .hidden { display: none !important; }
    .hint { font-size: 12px; color: #6c7086; text-align: center; margin-top: 8px; }

    @media (max-width: 980px) {
      .main-layout { flex-direction: column; align-items: center; }
      .controls, .editor-container, #three-view { width: 100%; max-width: 360px; }
    }
  </style>
</head>
<body>

  <h2>3D Apparel Design Studio</h2>
  <p class="subtitle">Dizaynını yarat, 3D-də canlı gör</p>

  <div class="main-layout">
    <!-- Sol Panel -->
    <div class="panel controls">
      <div class="row">
        <label><b>Geyim Növü:</b></label>
        <select id="apparel-type">
          <option value="tshirt">T-Shirt (Qısaqol)</option>
          <option value="hoodie">Hoodie (Uzunqol)</option>
        </select>
      </div>

      <div class="row">
        <label>Geyimin Rəngi:</label>
        <input type="color" id="shirt-color" value="#89b4fa">
      </div>

      <hr style="border-color:#45475a; width:100%;">

      <label><b>Tərəf Seçimi:</b></label>
      <div class="view-selector">
        <button id="btn-front" class="btn-toggle">Ön Tərəf</button>
        <button id="btn-back">Arxa Tərəf</button>
      </div>

      <hr style="border-color:#45475a; width:100%;">

      <label><b>Mətn Əlavə Et:</b></label>
      <input type="text" id="text-input" placeholder="Yazını daxil edin...">

      <div class="row">
        <label>Mətn Rəngi:</label>
        <input type="color" id="text-color" value="#ffffff">
      </div>

      <div class="row">
        <label>Font:</label>
        <select id="text-font">
          <option value="Arial">Arial</option>
          <option value="Impact">Impact</option>
          <option value="Courier New">Courier</option>
          <option value="Georgia">Georgia</option>
        </select>
      </div>

      <button id="add-text-btn">Mətni Əlavə Et</button>

      <hr style="border-color:#45475a; width:100%;">

      <label><b>Şəkil Yüklə:</b></label>
      <input type="file" id="image-upload" accept="image/*">

      <hr style="border-color:#45475a; width:100%;">

      <button id="delete-btn" class="btn-secondary">Seçili Elementi Sil</button>
      <button id="clear-btn" class="btn-danger">Cari Tərəfi Təmizlə</button>
      <button id="download-btn" class="btn-success">Dizaynı Yüklə (PNG)</button>
    </div>

    <!-- Orta Panel: 2D Canlı Dizayn Sahəsi -->
    <div class="panel">
      <h3 style="margin-top:0; text-align:center;" id="canvas-title">2D Dizayn (Ön Tərəf)</h3>
      <div class="editor-container">
        <svg class="apparel-svg" viewBox="0 0 100 100">
          <path id="apparel-path" fill="#89b4fa" stroke="#222" stroke-width="1" d="M 30,10 L 40,17 C 45,19 55,19 60,17 L 70,10 L 90,25 L 80,40 L 73,33 L 73,90 L 27,90 L 27,33 L 20,40 L 10,25 Z"/>
        </svg>

        <!-- Ön Canvas -->
        <div id="front-canvas-container" class="canvas-wrapper">
          <canvas id="canvas-front" width="220" height="340"></canvas>
        </div>

        <!-- Arxa Canvas -->
        <div id="back-canvas-container" class="canvas-wrapper hidden">
          <canvas id="canvas-back" width="220" height="340"></canvas>
        </div>
      </div>
      <p class="hint">Elementi seçib "Delete" düyməsinə basaraq da silə bilərsən</p>
    </div>

    <!-- Sağ Panel: 3D Baxış Sahəsi -->
    <div class="panel">
      <h3 style="margin-top:0; text-align:center;">3D Modelləmə</h3>
      <div id="three-view"></div>
      <div class="row" style="margin-top:10px; justify-content:center;">
        <button id="btn-autorotate" class="btn-secondary active">🔄 Avto Fırlanma: Açıq</button>
      </div>
      <p class="hint">Modeli siçanla sürüşdürüb əl ilə də çevirə bilərsən</p>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      let currentSide = 'front';
      let currentType = 'tshirt';

      // İki müstəqil Fabric.js canvas-ı yaradırıq
      const canvasFront = new fabric.Canvas('canvas-front');
      const canvasBack = new fabric.Canvas('canvas-back');

      function getActiveCanvas() {
        return currentSide === 'front' ? canvasFront : canvasBack;
      }

      const svgPaths = {
        tshirt: "M 30,10 L 40,17 C 45,19 55,19 60,17 L 70,10 L 90,25 L 80,40 L 73,33 L 73,90 L 27,90 L 27,33 L 20,40 L 10,25 Z",
        hoodie: "M 30,10 C 35,2 65,2 70,10 L 95,35 L 85,50 L 73,40 L 73,90 L 27,90 L 27,40 L 15,50 L 5,35 Z"
      };

      // ---- Geyim Növünü Dəyişmək ----
      document.getElementById('apparel-type').addEventListener('change', (e) => {
        currentType = e.target.value;
        document.getElementById('apparel-path').setAttribute('d', svgPaths[currentType]);
        update3DModel();
      });

      // ---- Rəng Dəyişmə ----
      document.getElementById('shirt-color').addEventListener('input', (e) => {
        const val = e.target.value;
        document.getElementById('apparel-path').setAttribute('fill', val);
        if (bodyMat) bodyMat.color.set(val);
        if (leftMat) leftMat.color.set(val);
        if (rightMat) rightMat.color.set(val);
      });

      // ---- Ön / Arxa Keçidi (indi 3D fırlanma ilə TOQQUŞMUR) ----
      document.getElementById('btn-front').addEventListener('click', () => {
        currentSide = 'front';
        document.getElementById('canvas-title').innerText = "2D Dizayn (Ön Tərəf)";
        document.getElementById('btn-front').classList.add('btn-toggle');
        document.getElementById('btn-back').classList.remove('btn-toggle');

        document.getElementById('front-canvas-container').classList.remove('hidden');
        document.getElementById('back-canvas-container').classList.add('hidden');

        targetRotationY = 0;
        setAutoRotate(false);
      });

      document.getElementById('btn-back').addEventListener('click', () => {
        currentSide = 'back';
        document.getElementById('canvas-title').innerText = "2D Dizayn (Arxa Tərəf)";
        document.getElementById('btn-back').classList.add('btn-toggle');
        document.getElementById('btn-front').classList.remove('btn-toggle');

        document.getElementById('back-canvas-container').classList.remove('hidden');
        document.getElementById('front-canvas-container').classList.add('hidden');

        targetRotationY = Math.PI;
        setAutoRotate(false);
      });

      // ---- Avto Fırlanma Aç/Bağla ----
      const autoRotateBtn = document.getElementById('btn-autorotate');
      function setAutoRotate(on) {
        autoRotate = on;
        autoRotateBtn.innerText = on ? "🔄 Avto Fırlanma: Açıq" : "🔄 Avto Fırlanma: Bağlı";
        autoRotateBtn.classList.toggle('active', on);
      }
      autoRotateBtn.addEventListener('click', () => setAutoRotate(!autoRotate));

      // ---- Mətn Əlavə Et ----
      document.getElementById('add-text-btn').addEventListener('click', () => {
        const txt = document.getElementById('text-input').value;
        if (!txt) return;

        const text = new fabric.Text(txt, {
          left: 50, top: 50,
          fontSize: 22,
          fontWeight: 'bold',
          fill: document.getElementById('text-color').value,
          fontFamily: document.getElementById('text-font').value
        });

        const activeCanvas = getActiveCanvas();
        activeCanvas.add(text);
        activeCanvas.setActiveObject(text);
        document.getElementById('text-input').value = '';
        activeCanvas.renderAll();
      });

      // ---- Şəkil Yüklə ----
      document.getElementById('image-upload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (f) => {
          const imgObj = new Image();
          imgObj.src = f.target.result;
          imgObj.onload = function() {
            const fabricImg = new fabric.Image(imgObj);
            fabricImg.scaleToWidth(110);
            fabricImg.set({ left: 55, top: 90 });

            const activeCanvas = getActiveCanvas();
            activeCanvas.add(fabricImg);
            activeCanvas.setActiveObject(fabricImg);
            activeCanvas.renderAll();
          };
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      });

      // ---- Seçili Elementi Sil (düymə + Delete/Backspace) ----
      function deleteSelected() {
        const c = getActiveCanvas();
        const obj = c.getActiveObject();
        if (obj) {
          c.remove(obj);
          c.renderAll();
        }
      }
      document.getElementById('delete-btn').addEventListener('click', deleteSelected);
      window.addEventListener('keydown', (e) => {
        const tag = document.activeElement.tagName;
        if ((e.key === 'Delete' || e.key === 'Backspace') && tag !== 'INPUT' && tag !== 'TEXTAREA') {
          deleteSelected();
        }
      });

      // ---- Cari Tərəfi Təmizlə ----
      document.getElementById('clear-btn').addEventListener('click', () => {
        getActiveCanvas().clear();
      });

      // ---- PNG Yüklə ----
      document.getElementById('download-btn').addEventListener('click', () => {
        const dataURL = getActiveCanvas().toDataURL({ format: 'png', quality: 1 });
        const a = document.createElement('a');
        a.download = `design-${currentSide}.png`;
        a.href = dataURL;
        a.click();
      });

      // ================= THREE.JS 3D Mühit =================
      const container = document.getElementById('three-view');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x11111b);

      const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.z = 4.8;

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      const light1 = new THREE.DirectionalLight(0xffffff, 1);
      light1.position.set(1, 2, 3);
      scene.add(light1);
      const light2 = new THREE.DirectionalLight(0xffffff, 0.5);
      light2.position.set(-1, -1, -2);
      scene.add(light2);
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));

      let shirtGroup = new THREE.Group();
      scene.add(shirtGroup);

      let bodyMat, leftMat, rightMat, frontTex, backTex;
      let autoRotate = true;
      let targetRotationY = 0;

      function update3DModel() {
        while (shirtGroup.children.length > 0) {
          shirtGroup.remove(shirtGroup.children[0]);
        }

        const shirtColor = document.getElementById('shirt-color').value;
        bodyMat = new THREE.MeshStandardMaterial({ color: shirtColor });
        leftMat = new THREE.MeshStandardMaterial({ color: shirtColor });
        rightMat = new THREE.MeshStandardMaterial({ color: shirtColor });

        // Bədən
        const bodyGeo = new THREE.BoxGeometry(1.3, 1.7, 0.3);
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
        shirtGroup.add(bodyMesh);

        // Qollar (T-Shirt vs Hoodie)
        const sleeveLen = currentType === 'hoodie' ? 1.2 : 0.5;
        const sleevePosY = currentType === 'hoodie' ? 0.1 : 0.45;

        const sleeveGeo = new THREE.BoxGeometry(0.38, sleeveLen, 0.3);

        const leftSleeve = new THREE.Mesh(sleeveGeo, leftMat);
        leftSleeve.position.set(-0.8, sleevePosY, 0);
        leftSleeve.rotation.z = 0.3;
        shirtGroup.add(leftSleeve);

        const rightSleeve = new THREE.Mesh(sleeveGeo, rightMat);
        rightSleeve.position.set(0.8, sleevePosY, 0);
        rightSleeve.rotation.z = -0.3;
        shirtGroup.add(rightSleeve);

        // Hoodie Kapüşonu
        if (currentType === 'hoodie') {
          const hoodGeo = new THREE.SphereGeometry(0.35, 16, 16);
          const hoodMesh = new THREE.Mesh(hoodGeo, bodyMat);
          hoodMesh.position.set(0, 0.85, -0.1);
          shirtGroup.add(hoodMesh);
        }

        // İki Ayrı Tekstura (Ön və Arxa üçün)
        frontTex = new THREE.CanvasTexture(document.getElementById('canvas-front'));
        backTex = new THREE.CanvasTexture(document.getElementById('canvas-back'));

        const printGeo = new THREE.PlaneGeometry(1.1, 1.5);

        const printMatFront = new THREE.MeshBasicMaterial({ map: frontTex, transparent: true });
        const printMeshFront = new THREE.Mesh(printGeo, printMatFront);
        printMeshFront.position.set(0, 0, 0.155);
        shirtGroup.add(printMeshFront);

        const printMatBack = new THREE.MeshBasicMaterial({ map: backTex, transparent: true });
        const printMeshBack = new THREE.Mesh(printGeo, printMatBack);
        printMeshBack.position.set(0, 0, -0.155);
        printMeshBack.rotation.y = Math.PI;
        shirtGroup.add(printMeshBack);
      }

      update3DModel();

      canvasFront.on('after:render', () => { if (frontTex) frontTex.needsUpdate = true; });
      canvasBack.on('after:render', () => { if (backTex) backTex.needsUpdate = true; });

      // ---- Siçanla əllə fırlatma ----
      let isDragging = false;
      let prevX = 0;
      container.addEventListener('mousedown', (e) => {
        isDragging = true;
        prevX = e.clientX;
        setAutoRotate(false);
      });
      window.addEventListener('mouseup', () => { isDragging = false; });
      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const delta = e.clientX - prevX;
        prevX = e.clientX;
        shirtGroup.rotation.y += delta * 0.01;
        targetRotationY = shirtGroup.rotation.y;
      });
      // Mobil toxunma dəstəyi
      container.addEventListener('touchstart', (e) => {
        isDragging = true;
        prevX = e.touches[0].clientX;
        setAutoRotate(false);
      });
      window.addEventListener('touchend', () => { isDragging = false; });
      window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const delta = e.touches[0].clientX - prevX;
        prevX = e.touches[0].clientX;
        shirtGroup.rotation.y += delta * 0.01;
        targetRotationY = shirtGroup.rotation.y;
      });

      // ---- Pəncərə ölçüsü dəyişəndə 3D görüntünü düzəlt ----
      window.addEventListener('resize', () => {
        const w = container.clientWidth, h = container.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      });

      // ---- Animasiya ----
      function animate() {
        requestAnimationFrame(animate);
        if (autoRotate) {
          shirtGroup.rotation.y += 0.008;
        } else if (!isDragging) {
          shirtGroup.rotation.y += (targetRotationY - shirtGroup.rotation.y) * 0.08;
        }
        renderer.render(scene, camera);
      }
      animate();
    });
  </script>
</body>
</html>
