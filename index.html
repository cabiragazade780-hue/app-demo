<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Apparel Design Studio (Fixed & Professional)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f17; color: #cdd6f4; margin: 0; padding: 20px; }
h2 { text-align: center; color: #cba6f7; margin-bottom: 4px; }
.subtitle { text-align: center; color: #a6adc8; margin-bottom: 24px; font-size: 14px; }
.main-layout { display: grid; grid-template-columns: 320px 1fr 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
.panel { background: #181825; padding: 20px; border-radius: 12px; border: 1px solid #313244; box-shadow: 0 8px 24px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 12px; }
.controls { height: max-content; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
input, select, button { padding: 9px 12px; border-radius: 6px; border: 1px solid #45475a; background: #11111b; color: #cdd6f4; font-size: 13px; transition: all 0.15s ease; width: 100%; }
input[type=range] { padding: 0; cursor: pointer; }
input[type=color] { height: 36px; padding: 2px; cursor: pointer; }
input:focus, select:focus { outline: none; border-color: #cba6f7; }
button { background: #cba6f7; color: #11111b; font-weight: 600; cursor: pointer; border: none; }
button:hover { background: #b4befe; }
button:active { transform: scale(0.98); }
.btn-toggle { background: #89b4fa !important; color: #11111b !important; }
.btn-danger { background: #f38ba8; color: #11111b; }
.btn-success { background: #a6e3a1; color: #11111b; }
.btn-secondary { background: #313244; color: #cdd6f4; }
.btn-secondary.active { background: #f9e2af; color: #11111b; }
.filter-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.filter-row button { font-size: 11px; padding: 6px 2px; }
.section-title { font-size: 12px; color: #9399b2; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; margin-top: 4px; }
.editor-container { position: relative; width: 100%; height: 420px; background: #11111b; border-radius: 12px; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 1px dashed #45475a; }
.apparel-svg { position: absolute; width: 300px; height: 400px; z-index: 1; pointer-events: none; opacity: 0.3; }
.canvas-wrapper { position: absolute !important; z-index: 2; width: 260px; height: 351px; }
.canvas-container { width: 100% !important; height: 100% !important; }
canvas { width: 100% !important; height: 100% !important; }
#three-view { width: 100%; height: 420px; border-radius: 12px; background: radial-gradient(circle at 50% 30%, #1e1e2e, #050508); cursor: grab; overflow: hidden; }
#three-view:active { cursor: grabbing; }
.view-selector { display: flex; gap: 8px; }
.hidden { display: none !important; }
.hint { font-size: 12px; color: #6c7086; text-align: center; margin: 0; }
.effects-panel { display: none; flex-direction: column; gap: 8px; background: #11111b; padding: 12px; border-radius: 8px; border: 1px solid #313244; }
.effects-panel.show { display: flex; }
.range-label { display: flex; justify-content: space-between; font-size: 12px; color: #a6adc8; }
hr { border: 0; border-top: 1px solid #313244; margin: 4px 0; width: 100%; }
#toast { position: fixed; bottom: 20px; right: 20px; background: #f38ba8; color: #11111b; padding: 12px 20px; border-radius: 8px; font-weight: bold; display: none; z-index: 1000; }
</style>
</head>
<body>

<div id="toast"></div>

<h2>3D Apparel Design Studio</h2>
<p class="subtitle">Dizaynını yarat, yüksək dəqiqliklə 3D-də canlı gör və eksport et</p>

<div class="main-layout">
  <div class="panel controls">
    <div class="row">
      <label><b>Geyim Növü:</b></label>
      <select id="apparel-type">
        <option value="tshirt">T-Shirt (Qısaqol)</option>
        <option value="hoodie">Hoodie (Uzunqol)</option>
      </select>
    </div>
    <div class="row">
      <label>Geyimin Rəngi:</label>
      <input type="color" id="shirt-color" value="#1e1e2e">
    </div>

    <div class="section-title">Material Fakturası</div>
    <div class="range-label"><span>Parıltı (Roughness)</span><span id="gloss-val">80%</span></div>
    <input type="range" id="gloss-slider" min="0" max="100" value="20">
    <div class="range-label"><span>Metallik</span><span id="metal-val">0%</span></div>
    <input type="range" id="metal-slider" min="0" max="100" value="0">

    <hr>

    <label><b>İdarə Olunan Tərəf:</b></label>
    <div class="view-selector">
      <button id="btn-front" class="btn-toggle">Ön Tərəf</button>
      <button id="btn-back">Arxa Tərəf</button>
    </div>

    <hr>

    <label><b>Mətn Əlavə Et:</b></label>
    <input type="text" id="text-input" placeholder="Yazını daxil edin...">
    <div class="row">
      <select id="text-font" style="width: 60%;">
        <option value="Arial">Arial</option>
        <option value="Impact">Impact</option>
        <option value="Courier New">Courier</option>
        <option value="Georgia">Georgia</option>
      </select>
      <input type="color" id="text-color" value="#ffffff" style="width: 35%;">
    </div>
    <button id="add-text-btn">Mətni Əlavə Et</button>

    <hr>

    <label><b>Şəkil Yüklə:</b></label>
    <input type="file" id="image-upload" accept="image/*">
    <div class="row" style="gap:5px;">
      <input type="text" id="image-url-input" placeholder="Şəkil URL-i...">
      <button id="image-url-btn" class="btn-secondary" style="width: 40%;">Yüklə</button>
    </div>

    <hr>

    <div id="effects-panel" class="effects-panel">
      <div class="section-title">Element Parametrləri</div>
      <div class="range-label"><span>Şəffaflıq</span><span id="opacity-val">100%</span></div>
      <input type="range" id="opacity-slider" min="0" max="100" value="100">

      <div class="row">
        <label><input type="checkbox" id="shadow-toggle"> Kölgə</label>
        <input type="color" id="shadow-color" value="#000000" style="width:40px; height:28px;">
      </div>

      <div class="section-title">Filtr</div>
      <div class="filter-row">
        <button class="btn-secondary" data-filter="none">Normal</button>
        <button class="btn-secondary" data-filter="gray">Ağ-Qara</button>
        <button class="btn-secondary" data-filter="sepia">Sepia</button>
        <button class="btn-secondary" data-filter="invert">İnvert</button>
      </div>
    </div>

    <button id="delete-btn" class="btn-secondary">Seçiləni Sil</button>
    <button id="clear-btn" class="btn-danger">Tərəfi Təmizlə</button>
    <button id="download-btn" class="btn-success">Dizaynı HD İxrac Et (PNG)</button>
  </div>

  <div class="panel">
    <h3 style="margin:0; text-align:center;" id="canvas-title">2D Dizayn (Ön Tərəf)</h3>
    <div class="editor-container">
      <svg class="apparel-svg" viewBox="0 0 100 100">
        <path id="apparel-path" fill="#1e1e2e" stroke="#ffffff" stroke-width="0.5" d="M 30,10 L 40,17 C 45,19 55,19 60,17 L 70,10 L 90,25 L 80,40 L 73,33 L 73,90 L 27,90 L 27,33 L 20,40 L 10,25 Z"/>
      </svg>
      <div id="front-canvas-container" class="canvas-wrapper">
        <canvas id="canvas-front" width="1000" height="1350"></canvas>
      </div>
      <div id="back-canvas-container" class="canvas-wrapper hidden">
        <canvas id="canvas-back" width="1000" height="1350"></canvas>
      </div>
    </div>
    <p class="hint">Təsviri və ya mətni sürüşdürün, miqyaslandırın.</p>
  </div>

  <div class="panel">
    <h3 style="margin:0; text-align:center;">3D Modelləmə</h3>
    <div id="three-view"></div>
    <div class="row">
      <button id="btn-autorotate" class="btn-secondary active">🔄 Auto-Rotate</button>
      <button id="btn-walk" class="btn-secondary">🚶 Animasiya</button>
    </div>
  </div>
</div>

<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3000);
}

window.addEventListener('DOMContentLoaded', () => {
  let currentSide = 'front';
  let currentType = 'tshirt';

  // ŞƏFFAFLIQ FIX: Canvas fonu tam şəkildə şəkilsiz/şəffaf olmalıdır
  const fabricConfig = { 
    backgroundColor: null, 
    preserveObjectStacking: true, 
    selectionColor: 'rgba(203,166,247,0.3)', 
    cornerColor: '#cba6f7', 
    cornerSize: 14 
  };
  
  const canvasFront = new fabric.Canvas('canvas-front', fabricConfig);
  const canvasBack = new fabric.Canvas('canvas-back', fabricConfig);

  function getActiveCanvas() { return currentSide === 'front' ? canvasFront : canvasBack; }

  const svgPaths = {
    tshirt: "M 30,10 L 40,17 C 45,19 55,19 60,17 L 70,10 L 90,25 L 80,40 L 73,33 L 73,90 L 27,90 L 27,33 L 20,40 L 10,25 Z",
    hoodie: "M 30,10 C 35,2 65,2 70,10 L 95,35 L 85,50 L 73,40 L 73,90 L 27,90 L 27,40 L 15,50 L 5,35 Z"
  };

  document.getElementById('apparel-type').addEventListener('change', (e) => {
    currentType = e.target.value;
    document.getElementById('apparel-path').setAttribute('d', svgPaths[currentType]);
    update3DModel();
  });

  document.getElementById('shirt-color').addEventListener('input', (e) => {
    const val = e.target.value;
    document.getElementById('apparel-path').setAttribute('fill', val);
    if (bodyMat) bodyMat.color.set(val);
    if (leftMat) leftMat.color.set(val);
    if (rightMat) rightMat.color.set(val);
  });

  document.getElementById('btn-front').addEventListener('click', () => {
    currentSide = 'front';
    document.getElementById('canvas-title').innerText = "2D Dizayn (Ön Tərəf)";
    document.getElementById('btn-front').classList.add('btn-toggle');
    document.getElementById('btn-back').classList.remove('btn-toggle');
    document.getElementById('front-canvas-container').classList.remove('hidden');
    document.getElementById('back-canvas-container').classList.add('hidden');
    targetRotationY = 0;
    setAutoRotate(false);
  });

  document.getElementById('btn-back').addEventListener('click', () => {
    currentSide = 'back';
    document.getElementById('canvas-title').innerText = "2D Dizayn (Arxa Tərəf)";
    document.getElementById('btn-back').classList.add('btn-toggle');
    document.getElementById('btn-front').classList.remove('btn-toggle');
    document.getElementById('back-canvas-container').classList.remove('hidden');
    document.getElementById('front-canvas-container').classList.add('hidden');
    targetRotationY = Math.PI;
    setAutoRotate(false);
  });

  const autoRotateBtn = document.getElementById('btn-autorotate');
  function setAutoRotate(on) {
    autoRotate = on;
    autoRotateBtn.classList.toggle('active', on);
  }
  autoRotateBtn.addEventListener('click', () => setAutoRotate(!autoRotate));

  const walkBtn = document.getElementById('btn-walk');
  walkBtn.addEventListener('click', () => {
    walking = !walking;
    walkBtn.classList.toggle('active', walking);
  });

  document.getElementById('add-text-btn').addEventListener('click', () => {
    const txt = document.getElementById('text-input').value;
    if (!txt) return;
    const text = new fabric.Text(txt, {
      left: 300, top: 300, fontSize: 72, fontWeight: 'bold',
      fill: document.getElementById('text-color').value,
      fontFamily: document.getElementById('text-font').value
    });
    const c = getActiveCanvas();
    c.add(text); c.setActiveObject(text);
    document.getElementById('text-input').value = '';
    c.renderAll();
  });

  document.getElementById('image-upload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (f) => {
      fabric.Image.fromURL(f.target.result, (img) => {
        img.scaleToWidth(400);
        img.set({ left: 300, top: 300 });
        const c = getActiveCanvas();
        c.add(img); c.setActiveObject(img); c.renderAll();
      });
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  // CORS və ALERT FIX
  document.getElementById('image-url-btn').addEventListener('click', () => {
    let url = document.getElementById('image-url-input').value.trim();
    if (!url) return;

    if (!url.startsWith('https://corsproxy.io/?')) {
      url = 'https://corsproxy.io/?' + encodeURIComponent(url);
    }

    fabric.Image.fromURL(url, (img, isError) => {
      if (isError || !img || !img.width) { 
        showToast('XƏTÂ: Şəkil yüklənə bilmədi.'); 
        return; 
      }
      img.scaleToWidth(400);
      img.set({ left: 300, top: 300 });
      const c = getActiveCanvas();
      c.add(img); 
      c.setActiveObject(img); 
      c.renderAll();
    }, { crossOrigin: 'anonymous' });
  });

  document.getElementById('delete-btn').addEventListener('click', () => {
    const c = getActiveCanvas();
    const obj = c.getActiveObject();
    if (obj) { c.remove(obj); c.renderAll(); }
  });

  document.getElementById('clear-btn').addEventListener('click', () => getActiveCanvas().clear());

  // FİLTR VƏ EFFEKT FIX
  document.querySelectorAll('.filter-row button').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = getActiveCanvas();
      const obj = c.getActiveObject();
      if (!obj || obj.type !== 'image') { 
        showToast('Əvvəlcə şəklin üzərinə klikləyin!'); 
        return; 
      }
      const type = btn.dataset.filter;
      obj.filters = [];
      if (type === 'gray') obj.filters.push(new fabric.Image.filters.Grayscale());
      if (type === 'sepia') obj.filters.push(new fabric.Image.filters.Sepia());
      if (type === 'invert') obj.filters.push(new fabric.Image.filters.Invert());
      
      obj.applyFilters();
      c.renderAll();
    });
  });

  // ================= THREE.JS MODEL DÜZƏLİŞİ =================
  const container = document.getElementById('three-view');
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(0, 0.2, 4.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  // GÜCLƏNDİRİLMİŞ İŞIQ
  const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
  scene.add(ambientLight);
  const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
  dirLight1.position.set(2, 4, 3);
  scene.add(dirLight1);

  let shirtGroup = new THREE.Group();
  scene.add(shirtGroup);

  let bodyMat, leftMat, rightMat, skinMat, frontTex, backTex;
  let leftArmGroup, rightArmGroup, leftLegGroup, rightLegGroup;
  let autoRotate = true, walking = false, walkClock = 0, targetRotationY = 0;

  function update3DModel() {
    while (shirtGroup.children.length > 0) shirtGroup.remove(shirtGroup.children[0]);

    const shirtColor = document.getElementById('shirt-color').value;
    bodyMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.5, metalness: 0.1 });
    leftMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.5, metalness: 0.1 });
    rightMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.5, metalness: 0.1 });
    skinMat = new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.6 });
    const pantsMat = new THREE.MeshStandardMaterial({ color: 0x11111b, roughness: 0.8 });

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 32, 32), skinMat);
    head.position.set(0, 1.15, 0);
    shirtGroup.add(head);

    const torso = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.3, 0.35), bodyMat);
    torso.position.set(0, 0.18, 0);
    shirtGroup.add(torso);

    function buildArm(side) {
      const group = new THREE.Group();
      group.position.set(side * 0.63, 0.75, 0);
      const sleeve = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.8, 0.28), side < 0 ? leftMat : rightMat);
      sleeve.position.set(0, -0.4, 0);
      group.add(sleeve);
      shirtGroup.add(group);
      return group;
    }
    leftArmGroup = buildArm(-1);
    rightArmGroup = buildArm(1);

    function buildLeg(side) {
      const group = new THREE.Group();
      group.position.set(side * 0.25, -0.47, 0);
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.0, 0.3), pantsMat);
      leg.position.set(0, -0.5, 0);
      group.add(leg);
      shirtGroup.add(group);
      return group;
    }
    leftLegGroup = buildLeg(-1);
    rightLegGroup = buildLeg(1);

    frontTex = new THREE.CanvasTexture(document.getElementById('canvas-front'));
    backTex = new THREE.CanvasTexture(document.getElementById('canvas-back'));
    
    [frontTex, backTex].forEach(tex => {
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
    });

    const printGeo = new THREE.PlaneGeometry(1.0, 1.35);

    // QARA KUTU VƏ Z-FIGHTING FIX: alphaTest + depthWrite + transparent
    const printFrontMat = new THREE.MeshBasicMaterial({ 
      map: frontTex, 
      transparent: true, 
      alphaTest: 0.05, 
      depthWrite: false 
    });
    const printFront = new THREE.Mesh(printGeo, printFrontMat);
    printFront.position.set(0, 0.18, 0.178);
    shirtGroup.add(printFront);

    const printBackMat = new THREE.MeshBasicMaterial({ 
      map: backTex, 
      transparent: true, 
      alphaTest: 0.05, 
      depthWrite: false 
    });
    const printBack = new THREE.Mesh(printGeo, printBackMat);
    printBack.position.set(0, 0.18, -0.178);
    printBack.rotation.y = Math.PI;
    shirtGroup.add(printBack);
  }

  update3DModel();

  canvasFront.on('after:render', () => { if (frontTex) frontTex.needsUpdate = true; });
  canvasBack.on('after:render', () => { if (backTex) backTex.needsUpdate = true; });

  let isDragging = false, prevX = 0;
  container.addEventListener('mousedown', (e) => { isDragging = true; prevX = e.clientX; setAutoRotate(false); });
  window.addEventListener('mouseup', () => isDragging = false);
  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const delta = e.clientX - prevX; prevX = e.clientX;
    shirtGroup.rotation.y += delta * 0.01;
    targetRotationY = shirtGroup.rotation.y;
  });

  function animate() {
    requestAnimationFrame(animate);
    if (autoRotate) {
      shirtGroup.rotation.y += 0.005;
    } else if (!isDragging) {
      shirtGroup.rotation.y += (targetRotationY - shirtGroup.rotation.y) * 0.08;
    }
    renderer.render(scene, camera);
  }
  animate();
});
</script>
</body>
</html>
