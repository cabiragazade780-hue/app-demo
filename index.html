<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Apparel Design Studio - Real Human</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: radial-gradient(circle at 20% 0%, #23233a 0%, #0c0c14 55%, #08080d 100%);
  color: #e6e6f0; margin: 0; padding: 24px; min-height: 100vh;
}
h2 {
  text-align: center; margin: 0 0 4px; font-size: 28px; font-weight: 800; letter-spacing: -0.5px;
  background: linear-gradient(90deg, #cba6f7, #89b4fa, #f5c2e7);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.subtitle { text-align: center; color: #8a8aa3; margin-bottom: 28px; font-size: 14px; }
.main-layout { display: grid; grid-template-columns: 300px 1fr 1fr; gap: 20px; max-width: 1450px; margin: 0 auto; }
@media (max-width: 1100px) { .main-layout { grid-template-columns: 1fr; max-width: 480px; } }

.panel {
  background: rgba(24,24,37,0.7); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.07);
  box-shadow: 0 12px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  display: flex; flex-direction: column; gap: 12px;
}
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
label { font-size: 13px; color: #b8b8d0; }
input, select, button {
  padding: 9px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.09);
  background: rgba(10,10,16,0.7); color: #e6e6f0; font-size: 13px; width: 100%; transition: all .15s ease;
}
input[type=range] { padding: 0; cursor: pointer; accent-color: #cba6f7; }
input[type=color] { height: 36px; padding: 2px; cursor: pointer; }
input:focus, select:focus { outline: none; border-color: #cba6f7; box-shadow: 0 0 0 3px rgba(203,166,247,0.15); }
button {
  background: linear-gradient(135deg, #cba6f7, #89b4fa); color: #11111b; font-weight: 700;
  cursor: pointer; border: none; box-shadow: 0 4px 14px rgba(137,180,250,0.25);
}
button:hover { filter: brightness(1.1); transform: translateY(-1px); }
button:active { transform: scale(0.97); }
.btn-toggle { background: linear-gradient(135deg, #f5c2e7, #cba6f7) !important; }
.btn-danger { background: linear-gradient(135deg, #f38ba8, #eb6f92); color: #11111b; }
.btn-success { background: linear-gradient(135deg, #a6e3a1, #7fd6a3); color: #11111b; }
.btn-secondary { background: rgba(255,255,255,0.06); color: #cdd6f4; box-shadow: none; }
.btn-secondary.active { background: linear-gradient(135deg,#f9e2af,#f5c26b); color: #11111b; }
.btn-mini { padding: 7px 6px; font-size: 11px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.section-title { font-size: 11px; color: #8a8aa3; text-transform: uppercase; font-weight: 700; letter-spacing: 0.8px; margin-top: 6px; }
.editor-container {
  position: relative; width: 100%; height: 440px;
  background: repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 6px), linear-gradient(160deg,#16161f,#0a0a10);
  border-radius: 14px; display: flex; justify-content: center; align-items: center;
  overflow: hidden; border: 1px dashed rgba(255,255,255,0.12);
}
.apparel-svg { position: absolute; width: 300px; height: 380px; z-index: 1; pointer-events: none; opacity: 0.35; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.print-guide {
  position: absolute; z-index: 1; pointer-events: none;
  border: 1.5px dashed rgba(203,166,247,0.6); border-radius: 6px;
  left: 50%; top: 50%; transform: translate(-50%, -50%); width: 160px; height: 210px;
}
.print-guide::after {
  content: 'Çap Sahəsi'; position: absolute; top: -18px; left: 0;
  font-size: 9.5px; color: rgba(203,166,247,0.8); white-space: nowrap;
}
.canvas-wrapper { position: absolute !important; z-index: 2; left: 50%; top: 50%; transform: translate(-50%, -50%); }
#three-view {
  width: 100%; height: 440px; border-radius: 14px;
  background: radial-gradient(circle at 50% 25%, #2a2a42, #08080d 75%);
  cursor: grab; overflow: hidden;
  position: relative;
}
#three-view:active { cursor: grabbing; }
.view-selector { display: flex; gap: 8px; }
.hidden { display: none !important; }
.hint { font-size: 11.5px; color: #6c6c85; text-align: center; margin: 0; line-height: 1.5; }
.effects-panel { display: none; flex-direction: column; gap: 8px; background: rgba(10,10,16,0.6); padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); }
.effects-panel.show { display: flex; }
.range-label { display: flex; justify-content: space-between; font-size: 12px; color: #a6adc8; }
hr { border: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 2px 0; width: 100%; }
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(24,24,37,0.95); backdrop-filter: blur(10px); color: #e6e6f0; padding: 12px 22px;
  border-radius: 30px; font-weight: 600; font-size: 13px; border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; z-index: 1000; opacity: 0; transition: opacity .25s, transform .25s;
}
#toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }
.paste-zone { border: 1px dashed rgba(255,255,255,0.15); border-radius: 8px; padding: 10px; text-align: center; font-size: 12px; color: #8a8aa3; }
.sticker-row { display: flex; gap: 6px; flex-wrap: wrap; }
.sticker-btn { width: auto; flex: 1; font-size: 18px; padding: 8px 0; background: rgba(255,255,255,0.06); box-shadow: none; }
.anim-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
#loader-status {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 13px; color: #cba6f7; background: rgba(10,10,16,0.85); padding: 10px 20px;
  border-radius: 8px; border: 1px solid rgba(203,166,247,0.3); pointer-events: none; z-index: 10;
}
</style>
</head>
<body>

<div id="toast"></div>

<h2>3D Apparel Design Studio</h2>
<p class="subtitle">Real İnsan Xarakteri (Anatomiya Modeli) və 2D/3D Sinxronizasiya</p>

<div class="main-layout">
  <div class="panel controls">
    <div class="row">
      <label><b>Geyim Növü:</b></label>
      <select id="apparel-type">
        <option value="tshirt">T-Shirt (Qısaqol)</option>
        <option value="hoodie">Hoodie (Uzunqol)</option>
      </select>
    </div>
    <div class="row">
      <label>Geyimin Rəngi:</label>
      <input type="color" id="shirt-color" value="#1e1e2e">
    </div>

    <div class="section-title">Material Fakturası</div>
    <div class="range-label"><span>Parıltı</span><span id="gloss-val">50%</span></div>
    <input type="range" id="gloss-slider" min="0" max="100" value="50">
    <div class="range-label"><span>Metallik</span><span id="metal-val">10%</span></div>
    <input type="range" id="metal-slider" min="0" max="100" value="10">

    <hr>
    <label><b>Tərəf Seçimi:</b></label>
    <div class="view-selector">
      <button id="btn-front" class="btn-toggle">Ön Tərəf</button>
      <button id="btn-back">Arxa Tərəf</button>
    </div>

    <hr>
    <label><b>Mətn Əlavə Et:</b></label>
    <input type="text" id="text-input" placeholder="Yazını daxil edin...">
    <div class="row">
      <select id="text-font" style="width:60%;">
        <option value="Arial">Arial</option>
        <option value="Impact">Impact</option>
        <option value="Courier New">Courier</option>
        <option value="Georgia">Georgia</option>
      </select>
      <input type="color" id="text-color" value="#ffffff" style="width:35%;">
    </div>
    <button id="add-text-btn">Mətni Əlavə Et</button>

    <hr>
    <label><b>Tez Nişanlar:</b></label>
    <div class="sticker-row">
      <button class="sticker-btn" data-sticker="★">★</button>
      <button class="sticker-btn" data-sticker="♦">♦</button>
      <button class="sticker-btn" data-sticker="⚡">⚡</button>
      <button class="sticker-btn" data-sticker="♠">♠</button>
      <button class="sticker-btn" data-sticker="●">●</button>
      <button class="sticker-btn" data-sticker="✦">✦</button>
    </div>

    <hr>
    <label><b>Şəkil:</b></label>
    <input type="file" id="image-upload" accept="image/*">
    <div class="paste-zone">📋 Şəkli kopyala və <b>Ctrl+V</b> et və ya buraya sürüklə</div>
    <div class="row" style="gap:5px;">
      <input type="text" id="image-url-input" placeholder="Şəkil URL-i...">
      <button id="image-url-btn" class="btn-secondary" style="width:40%;">Yüklə</button>
    </div>

    <hr>
    <div id="effects-panel" class="effects-panel">
      <div class="section-title">Element Parametrləri</div>
      <div class="range-label"><span>Şəffaflıq</span><span id="opacity-val">100%</span></div>
      <input type="range" id="opacity-slider" min="0" max="100" value="100">
      <div class="range-label"><span>Fırlatma</span><span id="rotate-val">0°</span></div>
      <input type="range" id="rotate-slider" min="0" max="360" value="0">
      <div class="range-label"><span>Ölçü</span><span id="scale-val">100%</span></div>
      <input type="range" id="scale-slider" min="10" max="300" value="
